worker_processes 2;
env TZ;
error_log /dev/stderr notice;
pid /app/run/nginx.pid;
events { worker_connections 1024; }
http {
    lua_package_path '/app/lua/?.lua;;';
    lua_shared_dict metrics 16m;
    resolver 127.0.0.11 ipv6=off valid=10s;
    lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    lua_ssl_verify_depth 5;
    client_max_body_size 16m;
    client_body_buffer_size 16m;
    client_body_timeout 10s;
    send_timeout 10s;
    access_log off;
    server_tokens off;
    recursive_error_pages on;
    init_by_lua_block { require('gateway').init() }
    init_worker_by_lua_block { require('gateway').init_worker() }
    upstream llm_pool {
        server 127.0.0.1:1;
        balancer_by_lua_block { require('gateway').balance() }
        keepalive 32;
    }
    server {
        listen 8080;
        set $gw_state '';
        set $gw_body '';
        set $gw_scheme http;
        set $gw_path /v1/chat/completions;
        set $gw_host '';
        set $gw_sni '';
        set $gw_auth '';
        header_filter_by_lua_block { require('gateway').headers() }
        body_filter_by_lua_block { require('gateway').body() }
        log_by_lua_block { require('gateway').log() }
        location = /livez { content_by_lua_block { ngx.say('ok') } }
        location = /readyz { content_by_lua_block { require('gateway').ready() } }
        location = /v1/chat/completions {
            access_by_lua_block { require('gateway').entry() }
            error_page 502 504 = @fallback;
            include proxy.conf;
        }
        location ~ ^/models/[A-Za-z0-9_-]+/v1/chat/completions$ {
            access_by_lua_block { require('gateway').entry() }
            error_page 502 504 = @fallback;
            include proxy.conf;
        }
        location @quota_proxy { content_by_lua_block { require('gateway').quota_proxy() } }
        location @fallback {
            access_by_lua_block { require('gateway').access(true) }
            error_page 502 504 = @terminal;
            include proxy.conf;
        }
        location @terminal { content_by_lua_block { require('gateway').terminal() } }
        location /v1/ { content_by_lua_block { require('gateway').api() } }
        location / { content_by_lua_block { require('core.errors').exit(404,'not_found') } }
    }
    server {
        listen 127.0.0.1:8081;
        set $gw_state '';
        set $gw_scheme http;
        set $gw_path /v1/chat/completions;
        set $gw_host '';
        set $gw_sni '';
        set $gw_auth '';
        location = /relay {
            access_by_lua_block { require('gateway').relay_access() }
            header_filter_by_lua_block {
                ngx.header['X-Relay-Sent']=ngx.var.upstream_bytes_sent or '-'
                ngx.header['X-Relay-Received']=ngx.var.upstream_bytes_received or '-'
                ngx.header['X-Relay-Header-Time']=ngx.var.upstream_header_time or '-'
            }
            include proxy.conf;
        }
        location / { return 404; }
    }
    server {
        listen 9090;
        location = /revision { content_by_lua_block { ngx.say(require('core.config').get().revision or 'bootstrap') } }
        location = /metrics { content_by_lua_block { require('plugins.observability').render() } }
        location / { return 404; }
    }
}
